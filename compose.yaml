name: ai-agent-collaboration
services:
  besu:
    image: hyperledger/besu:25.9.0
    command:
      - --genesis-file=/lab/genesis.json
      - --node-private-key-file=/lab/key
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=*
      - --data-path=/var/lib/besu
      - --min-gas-price=0
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - ./local-besu-lab:/lab:ro
      - besu-data:/var/lib/besu
    networks:
      - lab
  verifier:
    build:
      context: .
      dockerfile: docker/Dockerfile.verifier
    environment:
      BESU_RPC_URL: http://besu:8545
    depends_on:
      - besu
    networks:
      - lab
    profiles:
      - test
    command: ["python", "-m", "scripts.docker_smoke"]
  contract-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.contract-test
    environment:
      BESU_RPC_URL: http://besu:8545
    depends_on:
      - besu
    networks:
      - lab
    profiles:
      - test
volumes:
  besu-data:
networks:
  lab:
    internal: false
