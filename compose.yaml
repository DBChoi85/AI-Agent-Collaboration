name: ai-agent-collaboration
services:
  besu:
    image: hyperledger/besu:25.9.0
    command:
      - --genesis-file=/lab/genesis.json
      - --node-private-key-file=/lab/key
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=*
      - --data-path=/var/lib/besu
      - --min-gas-price=0
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - ./local-besu-lab:/lab:ro
      - besu-data:/var/lib/besu
    networks:
      - lab
  agent-a:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      AGENT_DOMAIN: domainA
      AGENT_NAME: producer
      AGENT_PUBLIC_URL: http://agent-a:8080
    networks:
      - lab
  agent-b:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      AGENT_DOMAIN: domainB
      AGENT_NAME: consumer
      AGENT_PUBLIC_URL: http://agent-b:8080
    networks:
      - lab
  a2a-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    depends_on:
      - agent-a
      - agent-b
    command: ["python", "-m", "scripts.a2a_exchange_test"]
    networks:
      - lab
    profiles:
      - test
  integrated-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.contract-test
    environment:
      BESU_RPC_URL: http://besu:8545
      AGENT_A_URL: http://agent-a:8080
      AGENT_B_URL: http://agent-b:8080
    depends_on:
      - besu
      - agent-a
      - agent-b
    command: ["node", "integrated.mjs"]
    networks:
      - lab
    profiles:
      - test
  sdk-agent-a:
    build:
      context: .
      dockerfile: docker/Dockerfile.a2a-sdk
    environment:
      AGENT_DOMAIN: domainA
      AGENT_NAME: producer
      AGENT_PUBLIC_URL: http://sdk-agent-a:8080
    networks:
      - lab
  sdk-agent-b:
    build:
      context: .
      dockerfile: docker/Dockerfile.a2a-sdk
    environment:
      AGENT_DOMAIN: domainB
      AGENT_NAME: consumer
      AGENT_PUBLIC_URL: http://sdk-agent-b:8080
    networks:
      - lab
  official-a2a-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.a2a-sdk
    command: ["python", "-m", "scripts.official_a2a_test"]
    depends_on:
      - sdk-agent-a
      - sdk-agent-b
    networks:
      - lab
    profiles:
      - test
  verifier:
    build:
      context: .
      dockerfile: docker/Dockerfile.verifier
    environment:
      BESU_RPC_URL: http://besu:8545
    depends_on:
      - besu
    networks:
      - lab
    profiles:
      - test
    command: ["python", "-m", "scripts.docker_smoke"]
  contract-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.contract-test
    environment:
      BESU_RPC_URL: http://besu:8545
    depends_on:
      - besu
    networks:
      - lab
    profiles:
      - test
volumes:
  besu-data:
networks:
  lab:
    internal: false
