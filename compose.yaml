name: ai-agent-collaboration
services:
  besu:
    image: hyperledger/besu:25.9.0
    command:
      - --genesis-file=/lab/genesis.json
      - --node-private-key-file=/lab/key
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,TXPOOL
      - --host-allowlist=*
      - --rpc-http-cors-origins=*
      - --data-path=/var/lib/besu
      - --min-gas-price=0
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - ./local-besu-lab:/lab:ro
      - besu-data:/var/lib/besu
    networks:
      - lab
  agent-a:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      AGENT_DOMAIN: domainA
      AGENT_NAME: producer
      AGENT_PUBLIC_URL: http://agent-a:8080
    networks:
      - lab
  agent-b:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    environment:
      AGENT_DOMAIN: domainB
      AGENT_NAME: consumer
      AGENT_PUBLIC_URL: http://agent-b:8080
    networks:
      - lab
  a2a-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    depends_on:
      - agent-a
      - agent-b
    command: ["python", "-m", "scripts.a2a_exchange_test"]
    networks:
      - lab
    profiles:
      - test
  integrated-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.contract-test
    environment:
      BESU_RPC_URL: http://besu:8545
      AGENT_A_URL: http://agent-a:8080
      AGENT_B_URL: http://agent-b:8080
    depends_on:
      - besu
      - agent-a
      - agent-b
    command: ["node", "integrated.mjs"]
    networks:
      - lab
    profiles:
      - test
  sdk-agent-a:
    build:
      context: .
      dockerfile: docker/Dockerfile.a2a-sdk
    environment:
      AGENT_DOMAIN: domainA
      AGENT_NAME: producer
      AGENT_PUBLIC_URL: http://sdk-agent-a:8080
    networks:
      - lab
  sdk-agent-b:
    build:
      context: .
      dockerfile: docker/Dockerfile.a2a-sdk
    environment:
      AGENT_DOMAIN: domainB
      AGENT_NAME: consumer
      AGENT_PUBLIC_URL: http://sdk-agent-b:8080
    networks:
      - lab
  auth-agent-a:
    build:
      context: .
      dockerfile: docker/Dockerfile.a2a-sdk
    environment:
      AGENT_DOMAIN: domainA
      AGENT_NAME: producer
      AGENT_PUBLIC_URL: http://auth-agent-a:8080
      A2A_REQUIRE_AUTH: "1"
    volumes:
      - agent-identities:/identities:ro
    networks:
      - lab
    profiles:
      - auth
  auth-agent-b:
    build:
      context: .
      dockerfile: docker/Dockerfile.a2a-sdk
    environment:
      AGENT_DOMAIN: domainB
      AGENT_NAME: consumer
      AGENT_PUBLIC_URL: http://auth-agent-b:8080
      A2A_REQUIRE_AUTH: "1"
    volumes:
      - agent-identities:/identities:ro
    networks:
      - lab
    profiles:
      - auth
  official-a2a-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.a2a-sdk
    command: ["python", "-m", "scripts.official_a2a_test"]
    depends_on:
      sdk-agent-a:
        condition: service_healthy
      sdk-agent-b:
        condition: service_healthy
    networks:
      - lab
    profiles:
      - test
  trust-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.trust-test
    networks:
      - lab
    profiles:
      - test
  identity-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.a2a-sdk
    command: ["python", "-m", "scripts.a2a_identity_bootstrap"]
    environment:
      IDENTITY_DIR: /identities
    volumes:
      - agent-identities:/identities
    networks:
      - lab
    profiles:
      - test
  authenticated-a2a-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.a2a-sdk
    command: ["python", "-m", "scripts.authenticated_a2a_test"]
    environment:
      EVIDENCE_OUTPUT: /evidence/authenticated-a2a.json
    volumes:
      - a2a-evidence:/evidence
      - agent-identities:/identities:ro
    networks:
      - lab
    profiles:
      - test
  official-a2a-besu-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.contract-test
    command: ["node", "official-a2a-besu.mjs"]
    environment:
      BESU_RPC_URL: http://besu:8545
      EVIDENCE_INPUT: /evidence/authenticated-a2a.json
    volumes:
      - a2a-evidence:/evidence:ro
    networks:
      - lab
    profiles:
      - test
  certificate-status:
    build:
      context: .
      dockerfile: docker/Dockerfile.contract-test
    command: ["node", "certificate-status.mjs", "${CERTIFICATE_STATUS_ACTION:-deploy}"]
    environment:
      BESU_RPC_URL: http://besu:8545
    volumes:
      - agent-identities:/identities:ro
      - certificate-chain:/chain
    networks:
      - lab
    profiles:
      - test
  onchain-revocation-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.a2a-sdk
    command: ["python", "-m", "scripts.onchain_revocation_test"]
    volumes:
      - agent-identities:/identities:ro
    networks:
      - lab
    profiles:
      - test
  verifier:
    build:
      context: .
      dockerfile: docker/Dockerfile.verifier
    environment:
      BESU_RPC_URL: http://besu:8545
    depends_on:
      - besu
    networks:
      - lab
    profiles:
      - test
    command: ["python", "-m", "scripts.docker_smoke"]
  contract-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.contract-test
    environment:
      BESU_RPC_URL: http://besu:8545
    depends_on:
      - besu
    networks:
      - lab
    profiles:
      - test
volumes:
  besu-data:
  agent-identities:
  a2a-evidence:
  certificate-chain:
networks:
  lab:
    internal: false
